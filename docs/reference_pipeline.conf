input {
  s3 {
    access_key_id       => "${OBS_AK}"
    secret_access_key   => "${OBS_SK}"
    bucket              => "bucket-origen"
    endpoint            => "https://obs.la-south-2.myhuaweicloud.com"
    region              => "la-south-2"
    prefix              => "loggg/"
    interval            => 300
    codec               => plain { charset => "ISO-8859-1" }
    temporary_directory => "/opt/data/tmp/"
    watch_for_new_files => true
    delete            => true
    backup_to_bucket  => "bucket-origen"
    backup_add_prefix => "backup/"
  }
}

filter {
  if "table=" not in [message] {
    drop {}
  }

  grok {
    match => {
      "message" => "^\[%{WORD:log_status}\]\s+%{NOTSPACE:raw_timestamp}\s+-\s+%{DATA:thread_info}\s+\[%{DATA:component}\]\s+%{GREEDYDATA:kv_payload}"
    }
    remove_field   => ["message"]
    tag_on_failure => ["_grokparsefailure"]
  }

  if "_grokparsefailure" in [tags] {
    ruby {
      code => '
        logger.warn("grok parse failure â registro descartado",
          :raw_message => event.get("message").to_s[0..300]
        )
      '
    }
    drop {}
  }

  fingerprint {
    source              => ["raw_timestamp", "thread_info", "kv_payload"]
    target              => "[@metadata][generated_id]"
    method              => "SHA256"
    concatenate_sources => true
  }

  kv {
    source      => "kv_payload"
    field_split => "|"
    value_split => "="
    trim_value  => "\s"
    trim_key    => "\s"
    target      => "transaction"
  }

  if [transaction][trxl_term_id] == "health_check" {
    drop {}
  }

  if [transaction][trxl_entry_tim] {
    date {
      match          => ["[transaction][trxl_entry_tim]", "yyyyMMddHHmmssSSS"]
      target         => "@timestamp"
      timezone       => "America/Argentina/Buenos_Aires"
      tag_on_failure => ["_dateparsefailure_entry_tim"]
    }
  } else {
    mutate { gsub => ["raw_timestamp", ":(\d{3})\d+", ":\1"] }
    date {
      match          => ["raw_timestamp", "yyyyMMddHHmmss:SSS"]
      target         => "@timestamp"
      timezone       => "America/Argentina/Buenos_Aires"
      tag_on_failure => ["_dateparsefailure_raw"]
    }
  }

  ruby {
    init => '
      @whitelist = Set.new([
        "trxl_write_timestamp", "trxl_msg_typ", "trxl_client_id",
        "trxl_term_id", "trxl_seq_num", "trxl_resp",
        "trxl_tech_detail", "trxl_transaction_code",
        "trxl_client_id_type", "trxl_client_plain_id",
        "trxl_configuration_group", "trxl_banners_group", "trxl_detail",
        "trxl_amount1", "trxl_amount2", "trxl_amount3", "trxl_amount4",
        "trxl_date1", "trxl_date2", "trxl_date3", "trxl_date4",
        "trxl_account_pri_id1", "trxl_account_pri_id2",
        "trxl_account_pri_id3", "trxl_account_pri_id4",
        "trxl_account_sec_id1", "trxl_account_sec_id2",
        "trxl_account_sec_id3", "trxl_account_sec_id4",
        "trxl_account1", "trxl_account2", "trxl_account3", "trxl_account4",
        "trxl_text1", "trxl_text2", "trxl_text3", "trxl_text4",
        "trxl_flag1", "trxl_flag2", "trxl_flag3", "trxl_flag4",
        "trxl_flag5", "trxl_flag6", "trxl_flag7", "trxl_flag8",
        "trxl_currency1", "trxl_currency2", "trxl_orig_pro_node"
      ])

      @zeros_required = Set.new([
        "trxl_amount1", "trxl_amount2", "trxl_amount3", "trxl_amount4",
        "trxl_seq_num", "trxl_msg_typ",
        "trxl_configuration_group", "trxl_banners_group"
      ])
    '
    code => '
      trx = event.get("transaction")
      next unless trx.is_a?(Hash)

      if trx.key?("TRXL_CLIENT_ID")
        trx["trxl_client_id"] ||= trx["TRXL_CLIENT_ID"]
        trx.delete("TRXL_CLIENT_ID")
      end

      trx.delete_if { |k, _| !@whitelist.include?(k) }

      trx.each do |k, v|
        if v == "null" || (v.is_a?(String) && v.strip.empty?)
          trx[k] = nil
        end
      end

      @zeros_required.each do |f|
        trx[f] = 0 if trx[f].nil?
      end

      event.set("transaction", trx)

      tk_term = trx["trxl_term_id"]
      tk_seq  = trx["trxl_seq_num"]
      if tk_term && tk_seq
        event.set("[transaction][txn_key]", "#{tk_term}:#{tk_seq}")
      end
    '
  }

  mutate {
    convert => {
      "[transaction][trxl_amount1]"             => "float"
      "[transaction][trxl_amount2]"             => "float"
      "[transaction][trxl_amount3]"             => "float"
      "[transaction][trxl_amount4]"             => "float"
      "[transaction][trxl_msg_typ]"             => "integer"
      "[transaction][trxl_seq_num]"             => "integer"
      "[transaction][trxl_configuration_group]" => "integer"
      "[transaction][trxl_banners_group]"       => "integer"
    }
  }

  if [transaction][trxl_tech_detail] {
    mutate {
      gsub => ["[transaction][trxl_tech_detail]", '\\"', '"']
    }
    json {
      source               => "[transaction][trxl_tech_detail]"
      target               => "[transaction][trxl_tech_detail]"
      skip_on_invalid_json => true
    }
  }

  if [transaction][trxl_detail] {
    kv {
      source      => "[transaction][trxl_detail]"
      field_split => "~"
      value_split => "="
      target      => "[transaction][trxl_detail]"
    }
  }

  if [transaction][trxl_detail][GEO_LAT] and [transaction][trxl_detail][GEO_LONG] {
    ruby {
      code => '
        lat = event.get("[transaction][trxl_detail][GEO_LAT]").to_s.strip
        lon = event.get("[transaction][trxl_detail][GEO_LONG]").to_s.strip
        if lat =~ /\A-?\d+(\.\d+)?\z/ && lon =~ /\A-?\d+(\.\d+)?\z/
          latf = lat.to_f
          lonf = lon.to_f
          if latf.abs <= 90 && lonf.abs <= 180 && !(latf == 0.0 && lonf == 0.0)
            event.set("[transaction][trxl_geo]", "#{lat},#{lon}")
          end
        end
      '
    }
  }

  if [transaction][trxl_tech_detail][data][steps] {
    ruby {
      code => '
        steps = event.get("[transaction][trxl_tech_detail][data][steps]")
        if steps.is_a?(Array)
          steps.each do |step|
            ["serviceIn", "serviceOut", "begin", "end"].each do |f|
              step.delete(f) if step[f].is_a?(String) && step[f].empty?
            end
          end
          event.set("[transaction][trxl_tech_detail][data][steps]", steps)
        end
      '
    }
  }

  if [transaction][trxl_tech_detail][data][steps] {
    ruby {
      code => '
        steps = event.get("[transaction][trxl_tech_detail][data][steps]")
        next unless steps.is_a?(Array) && !steps.empty?

        ordered = steps.sort_by { |s| (s["index"] || s["counter"]).to_i }

        total     = ordered.size
        completed = ordered.count { |s| s["status"] == "C" }
        had_to    = ordered.any?  { |s| s["timedout"] == "True" }
        had_late  = ordered.any?  { |s| s["lateResp"] == "True" }

        last_step  = ordered.last
        ok_steps   = ordered.select { |s| s["status"] == "C" }
        deepest_ok = ok_steps.last
        first_bad  = ordered.find  { |s| s["status"] != "C" }

        reached = ordered.map { |s| s["code"] }
        oks     = ok_steps.map { |s| s["code"] }

        funnel = {
          "steps_total"      => total,
          "steps_completed"  => completed,
          "steps_reached"    => reached,
          "steps_ok"         => oks,
          "last_step_code"   => last_step  ? last_step["code"]        : nil,
          "last_step_index"  => last_step  ? last_step["index"].to_i  : nil,
          "last_step_status" => last_step  ? last_step["status"]      : nil,
          "deepest_ok_code"  => deepest_ok ? deepest_ok["code"]       : nil,
          "failed"           => (completed < total) || had_to,
          "failed_at_code"   => first_bad  ? first_bad["code"]        : nil,
          "had_timeout"      => had_to,
          "had_late_resp"    => had_late
        }

        event.set("[transaction][funnel]", funnel)
      '
    }
  }

  mutate {
    remove_field => [
      "kv_payload", "raw_timestamp", "thread_info",
      "log_status", "component", "@version",
      "[host]", "[path]", "[tags]"
    ]
  }
}

output {
  elasticsearch {
    hosts           => ["http://IP:9200"]
    index           => "logs-hoje-%{+YYYY.MM.dd}"
    action          => "index"
    document_id     => "%{[@metadata][generated_id]}"
    manage_template => false
    ilm_enabled     => false
    user            => "admin"
    password        => "${PASSWORD}"
  }

  s3 {
    access_key_id     => "${OBS_AK}"
    secret_access_key => "${OBS_SK}"
    bucket            => "<bucket-destino>"
    endpoint          => "https://obs.la-south-2.myhuaweicloud.com"
    region            => "la-south-2"
    prefix            => "transactions/year=%{+YYYY}/month=%{+MM}/day=%{+dd}/"
    codec             => "json_lines"
    encoding          => "gzip"
    time_file         => 15
    restore           => true
  }
}
