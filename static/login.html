<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Blueprint</title>
  <style>
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f6f5f1; --bg-tertiary: #efeee8; --bg-subtle: #faf9f6;
      --border-subtle: #e7e5dd; --border-default: #d9d7cd;
      --text-primary: #15161a; --text-secondary: #515463; --text-muted: #8a8b94;
      --accent: #7f0001; --accent-hover: #660001; --accent-tint: rgba(127,0,1,0.08);
      --accent-ring: rgba(127,0,1,0.22); --accent-red: #e50000;
      --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px;
      --shadow-lg: 0 16px 40px rgba(20,22,30,0.10);
      --font-sans: 'Huawei Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --ease: cubic-bezier(0.4,0,0.2,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans); color: var(--text-primary); line-height: 1.6;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background:
        radial-gradient(900px 420px at 50% -8%, var(--accent-tint), transparent 62%),
        var(--bg-secondary);
    }
    .card {
      width: 100%; max-width: 392px; background: var(--bg-primary);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
      padding: 32px 30px; box-shadow: var(--shadow-lg);
    }
    /* Marca — igual que el rail de la app */
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; }
    .brand__logo {
      width: 40px; height: 40px; flex: none; border-radius: var(--radius-md);
      background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center;
    }
    .brand__text { display: flex; flex-direction: column; line-height: 1.2; }
    .brand__name { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .brand__sub { font-size: 11.5px; color: var(--text-muted); }
    .eyebrow {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 8px;
    }
    h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 6px; }
    .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 22px; }
    label {
      display: block; font-size: 11.5px; font-weight: 700; color: var(--text-secondary);
      margin: 0 0 6px; letter-spacing: 0.02em;
    }
    input {
      width: 100%; padding: 11px 13px; margin-bottom: 16px; font-size: 14px; font-family: inherit;
      color: var(--text-primary); background: var(--bg-tertiary);
      border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      transition: border-color .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
    }
    input:focus {
      outline: none; background: var(--bg-primary);
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring);
    }
    button {
      width: 100%; padding: 12px; font-size: 14px; font-weight: 700; font-family: inherit; color: #fff;
      cursor: pointer; border: none; border-radius: var(--radius-sm); background: var(--accent);
      transition: background .15s var(--ease);
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: var(--accent-red); font-size: 12.5px; margin: 0 0 14px; min-height: 16px; font-weight: 500; }
    .foot { color: var(--text-muted); font-size: 11.5px; margin-top: 18px; text-align: center; }
  </style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <div class="brand">
      <span class="brand__logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      </span>
      <span class="brand__text">
        <span class="brand__name">Blueprint</span>
        <span class="brand__sub">Huawei Cloud CSS</span>
      </span>
    </div>
    <span class="eyebrow">Acceso de SAs</span>
    <h1>Ingresá a la plataforma</h1>
    <p class="sub">Entrá con tu cuenta para armar pipelines, desplegar y usar el asistente.</p>
    <p class="err" id="err"></p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required placeholder="vos@huawei.com" autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required placeholder="••••••••">
    <button type="submit" id="btn">Ingresar</button>
    <p class="foot">Tu primer ingreso crea la cuenta con esa contraseña.</p>
  </form>
  <script>
    const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
    f.addEventListener('submit', async (e) => {
      e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Ingresando…';
      try {
        const r = await fetch('/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify({ email: f.email.value, password: f.password.value }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) { window.location.href = '/'; return; }
        err.textContent = d.error || 'No se pudo ingresar.';
      } catch (_e) {
        err.textContent = 'Error de red. Reintentá.';
      }
      btn.disabled = false; btn.textContent = 'Ingresar';
    });
  </script>
</body>
</html>
